[build-system]
requires = ["setuptools>=84.0.0", "setuptools-scm>=10.2.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blink2mqtt"
dynamic = ["version"]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "blinkpy>=0.25.9",
    "deepmerge==3.0",
    "paho-mqtt>=2.1.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "json-logging-graystorm",
    "mqtt-helper-graystorm",
]

[project.scripts]
blink2mqtt = "blink2mqtt.app:main"

[project.optional-dependencies]
dev = [
    # linting/formatting/static typing
    "ruff>=0.16.3",

    # testing/coverage
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",

    # misc
    "jsonschema>=4.26.0",
    "packaging>=26.3",
    "attrs>=26.1.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
blink2mqtt = ["VERSION"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["blink2mqtt*"]

[tool.setuptools_scm]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

# Line length for both the linter and the formatter.
line-length = 160
indent-width = 4

# Assume Python 3.13
target-version = "py312"

[tool.ruff.lint]
ignore = [
    "BLE001",  # long-running MQTT/Blink service intentionally uses broad `except Exception` to stay resilient (see loops.py, blink_api.py)
    "DTZ005",  # timestamps/daily counters intentionally use local time; forcing UTC would shift semantics
    "DTZ007",  # same: intentional local-time parsing
]

[tool.pyright]
include = [ "src" ]
extraPaths = [ "src" ]
venvPath = "./.venv"
typeCheckingMode = "basic"
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--quiet"
testpaths = "tests"
pythonpath = "src"

[tool.coverage.run]
# .coveragerc
branch = true
source = ["blink2mqtt"]
omit = [
    "tests/*",
    "*/__init__.py",
    "*/venv/*",
    "*/.venv/*",
    "*/site-packages/*"
]

[tool.coverage.report]
fail_under = 75
show_missing = true
skip_covered = false
precision = 1
exclude_lines = [
    "pragma: no cover"
]

[tool.uv.sources]
json-logging-graystorm = { git = "https://github.com/weirdtangent/json-logging.git", rev = "5e245601ad2da7676a52281345e4040bb0281ffb" }
mqtt-helper-graystorm = { git = "https://github.com/weirdtangent/mqtt-helper.git", rev = "be1f0ab95054aa3e1c5609863fd2ae582f9d5649" }

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
    "types-pyyaml>=6.0.12.20260815",
    "pip-audit>=2.10.1",
]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_return_any = true
warn_redundant_casts = true
warn_unreachable = true
strict_equality = true
allow_untyped_globals = false
allow_redefinition = false
no_implicit_optional = true
warn_unused_configs = true

# Temporarily quiet noisy files or folders
[[tool.mypy.overrides]]
module = [
  "blinkpy.*",
  "aiohttp.*",
  "paho.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true
