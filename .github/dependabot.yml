version: 2
updates:
    - package-ecosystem: "uv"
      directory: "/"
      schedule:
          interval: "weekly"
      groups:
          all-dependencies:
              patterns:
                  - "*"
    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "daily"
      groups:
          all-actions:
              patterns:
                  - "*"
    - package-ecosystem: "docker"
      directory: "/"
      schedule:
          interval: "weekly"
      groups:
          all-docker:
              patterns:
                  - "*"
